[package]
name = "chutegpt"
version = "0.1.0"
edition = "2024"
description = "Interactive historical lottery analysis terminal application"

[dependencies]
calamine = { version = "=0.38.0", features = ["dates"] }
chrono = "=0.4.42"
crossterm = "=0.29.0"
ratatui = { version = "=0.30.2", default-features = false, features = ["crossterm", "unstable-rendered-line-info"] }
serde_json = "=1.0.145"
sha2 = "=0.10.9"
zip = { version = "=9.0.0", default-features = false, features = ["deflate"] }
