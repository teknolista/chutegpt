schema: spec-driven

context: |
  ChuteGPT is a Rust CLI intended for Linux desktop terminals.
  PentaPRO in pentapro/ maintains project facts and specifications; OpenSpec owns active changes and their scenarios and tasks. Reconcile changed records and validation evidence across both.
  Lottery rules and datasets vary over time. Consult docs/dia-de-sorte-referencia.md and verify applicable official sources and versions.
  Statistical claims must state assumptions, sample space, numerical precision and limitations; historical patterns do not guarantee future results.
  Write specification artifacts in English. Conversations, docs/ and the root README.md use Brazilian Portuguese; preserve localized content and literal names where needed.
rules:
  proposal:
    - Identify scope, affected PentaPRO records, assumptions and unresolved decisions.
  specs:
    - Express observable scenarios, including relevant boundaries and failure cases.
  tasks:
    - Include Linux validation, statistical checks and PentaPRO reconciliation when applicable.
